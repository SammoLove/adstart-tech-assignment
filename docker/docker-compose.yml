services:
  app:
    image: adstartmedia/domain-watchdog:latest
    container_name: domain-watchdog
#    build:
#      context: ..
#      dockerfile: docker/Dockerfile
    environment:
      DATASOURCE_URL:      jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      DATASOURCE_USERNAME: ${DB_USERNAME}
      DATASOURCE_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db
#    healthcheck:
#      test: [ "CMD-SHELL", "pg_isready -U ${OBS_DATASOURCE_USERNAME} -d obs" ]
#      interval: 5s
#      retries: 5
#      start_period: 5s
#      timeout: 30s

  db:
    image: postgres:17-alpine
    container_name: domain-watchdog-postgres
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 60s
      retries: 2
      start_period: 3s
      timeout: 10s

volumes:
  pgdata: